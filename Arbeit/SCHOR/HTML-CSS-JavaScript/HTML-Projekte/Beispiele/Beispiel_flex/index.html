<!DOCTYPE html>
<html lang="de-at">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Flexbox-Beispiel</title>
    <style>
    .container {
        display: flex; /* Aktiviert Flexbox für den Container */
        justify-content: space-between; /* Elemente gleichmäßig verteilen */
        padding: 10px; /* Platz um den Container herum hinzufügen */
    }

    .item {
        flex: 1; /* Alle Elemente nehmen den verfügbaren Platz gleichermaßen ein */
        background-color: #3498db;
        color: #fff;
        text-align: center;
        padding: 10px;
        border: 1px solid black;
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Element 1.0</div>
        <div class="item">Element 2.0</div>
        <div class="item">Element 3.0</div>
        <div class="item">Element 4.0</div>
        <div class="item">Element 5.0</div>
    </div>
</body>
</html>
