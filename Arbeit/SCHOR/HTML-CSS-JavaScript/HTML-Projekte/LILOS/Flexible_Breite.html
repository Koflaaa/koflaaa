 <title>Lilos Bilderladen</title>
 <style>
   .container {
   max-width: 100%;
   margin: 0 auto;

   padding: 20px;
   border: 1px solid #ddd;
   border-radius: 5px;
   box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
   margin-bottom: 20px;
   box-sizing: border-box;
   }
  </style>
 </head>
 <body>
 <main class="container">
  <div class="content">
   <h1>Anpassbare Webseite</h1>
   <p>Dieser Text und alle anderen Inhalte passen sich automatisch

  </div>
  </main>
