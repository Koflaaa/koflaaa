<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Animation</title>
        <style>
            div {
                width: 100px;
                height: 100px;
                border-radius: 50px;
                background-color: lightgray;
                animation: farbwechsel 10s infinite;
                animation-delay: 3s;
            }
            @keyframes farbwechsel {
                0% 
                {
                    background-color: lightgray;
                    left: 0px;
                    top: 0px;
                    border-radius: 50px;
                }
                25%
                {
                    background-color: red;
                    left: 250px;
                    top: 0px;
                    border-radius: 38px;
                }
                50%
                {
                    background-color: green;
                    left: 250px;
                    top: 250px;
                    border-radius: 25;
                }
                75%
                {
                    background-color: black;
                    left: 0px;
                    top: 250px;
                    border-radius: 13px;
                }
                100%
                {
                    background-color: gold;
                    left: 0px;
                    top: 0px;
                    border-radius: 0px;
                }
            }
        </style>
    </head>
    <body>
        <div></div>
    </body>
</html>
